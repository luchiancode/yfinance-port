[project]
name = "yfinance-rest-mcp"
version = "0.1.0"
description = "An HTTP API for accessing Yahoo Finance data through yfinance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "luchiancode", email = "luchian.ionica@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "mcp==2.2.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.3",
    "sqlmodel==0.0.47",
    "yfinance==1.7.0",
]

[project.scripts]
yfinance-rest = "yfinance_rest_mcp.api:main"
yfinance-mcp = "yfinance_rest_mcp.mcp:main"

[tool.fastapi]
entrypoint = "yfinance_rest_mcp.api:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
